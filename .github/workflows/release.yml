name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test
        run: python -m cyberquality.cli --help

      - name: Build distributable archive
        run: |
          mkdir -p dist
          zip -r "dist/cyberquality-static-assessor-${GITHUB_REF_NAME}.zip" \
            cyberquality demo docs .github app.py main.py README.md LICENSE SECURITY.md \
            requirements.txt requirements-dev.txt pyproject.toml .gitignore CHANGELOG.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/cyberquality-static-assessor-${GITHUB_REF_NAME}.zip" \
            --generate-notes \
            --title "CyberQuality Static Assessor $GITHUB_REF_NAME"

[project]
name = "cyberquality-static-assessor"
version = "0.1.0"
description = "Static rule-based cybersecurity assessment module for adaptive educational platforms"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "sample_reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
